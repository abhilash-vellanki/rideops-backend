spring.application.name=rideops-backend
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=${JDBC_DATABASE_URL}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
jwt.secretKey=${SECRET_KEY}
springdoc.swagger-ui.path=/swagger-ui.html
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.osrm.base-url=${OSRM_BASE_URL:https://router.project-osrm.org/route/v1/driving/}
app.osrm.connect-timeout=${OSRM_CONNECT_TIMEOUT:3s}
app.osrm.read-timeout=${OSRM_READ_TIMEOUT:5s}
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
