    <path d="M61 73C61 49.8 79.8 31 103 31C126.2 31 145 49.8 145 73C145 104.5 103 139 103 139C103 139 61 104.5 61 73Z" fill="#0D2E48" stroke="#5DE4C7" stroke-width="5"/>
