      <rect x="66" y="35" width="17" height="7" rx="3.5" fill="#D9F8F1"/>
    </g>
  </g>

  <g transform="translate(375 116)">
    <text x="0" y="77" fill="#F3FAFF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="86" font-weight="760" letter-spacing="-3">RideOps</text>
    <text x="4" y="137" fill="#5DE4C7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650" letter-spacing="6">BACKEND</text>
    <text x="4" y="194" fill="#B9CCDF" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25">Secure ride orchestration, spatial matching, payments &amp; operations</text>
    <g transform="translate(4 224)">
      <rect width="146" height="42" rx="21" fill="#5DE4C7" fill-opacity="0.12" stroke="#5DE4C7" stroke-opacity="0.45"/>
