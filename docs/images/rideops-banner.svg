<svg width="1600" height="440" viewBox="0 0 1600 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">RideOps Backend</title>
  <desc id="description">A dark blue RideOps banner with a route, map pins, and a car.</desc>
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1510" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071426"/>
      <stop offset="0.55" stop-color="#0B2440"/>
      <stop offset="1" stop-color="#073B4C"/>
    </linearGradient>
    <linearGradient id="road" x1="920" y1="110" x2="1510" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D0BA"/>
      <stop offset="1" stop-color="#4E8CFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="126" y1="116" x2="535" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5DE4C7"/>
      <stop offset="1" stop-color="#4E8CFF"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#9BB7D4" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="440" rx="28" fill="url(#background)"/>
  <rect width="1600" height="440" rx="28" fill="url(#grid)"/>
  <circle cx="1490" cy="-20" r="270" fill="#4E8CFF" fill-opacity="0.08"/>
  <circle cx="1110" cy="470" r="250" fill="#35D0BA" fill-opacity="0.07"/>

